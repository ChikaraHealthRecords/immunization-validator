# ─── Database / JPA / Cache ───────────────────────────────────────────────────
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/immunization_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate      # run vaccines.sql once first, then use validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  cache:
    type: simple

  # Default mode needs no database: vaccine data comes from vaccines/vaccines.csv.
  # The datasource and JPA auto-configuration is switched off here and switched back on
  # by the local, docker and prod profiles (they set immunization.vaccines.source=database).
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration

# ─── Actuator ─────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# ─── Validation behaviour ─────────────────────────────────────────────────────
immunization:
  validation:
    # FLEXIBLE (default): if alternate path fails, fall back to primary
    # STRICT:             if alternate path fails, mark INVALID immediately
    alternate-behavior: FLEXIBLE

  # State rules: one file per state in src/main/resources/rules/states/
  # (e.g. ma.yml). See CONTRIBUTING.md for the format. To load them from
  # somewhere else, set a resource pattern here, e.g.
  #   requirements:
  #     location: file:/etc/validator/rules/*.yml
