# ─── Database / JPA / Cache ───────────────────────────────────────────────────
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/immunization_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate      # run vaccines.sql once first, then use validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  cache:
    type: simple

# ─── Actuator ─────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# ─── Validation behaviour ─────────────────────────────────────────────────────
immunization:
  validation:
    # FLEXIBLE (default): if alternate path fails, fall back to primary
    # STRICT:             if alternate path fails, mark INVALID immediately
    alternate-behavior: FLEXIBLE

  # State rules: one file per state in src/main/resources/rules/states/
  # (e.g. ma.yml). See CONTRIBUTING.md for the format. To load them from
  # somewhere else, set a resource pattern here, e.g.
  #   requirements:
  #     location: file:/etc/validator/rules/*.yml
