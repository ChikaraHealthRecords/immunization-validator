# ─── BACKEND CI/CD PIPELINE ──────────────────────────────────────────────────
# Trigger: any push to main branch that touches backend-relevant files.
# Flow: Run tests → Build JAR → Build Docker image → Push to ECR → Deploy to ECS
# ─────────────────────────────────────────────────────────────────────────────
name: Backend CI/CD

on:
  push:
    branches:
      - main   # Only run on main — not on feature branches
    paths:
      # Only trigger if these files actually changed.
      # A docs-only commit won't waste 10 minutes rebuilding the backend.
      - 'src/**'
      - 'pom.xml'
      - 'Dockerfile'

jobs:
  build-and-deploy:
    # Use GitHub's Ubuntu runner — free tier, no setup needed.
    runs-on: ubuntu-latest

    steps:
      # ── Step 1: Get the code ───────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4
        # Pulls your full repo into the runner's workspace so subsequent
        # steps can see all your files.

      # ── Step 2: Set up Java 21 ─────────────────────────────────────────────
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'    # Same JDK vendor as your Docker image — consistency
          cache: 'maven'             # Cache ~/.m2 between runs — speeds up builds by ~2min

      # ── Step 3: Run tests ──────────────────────────────────────────────────
      - name: Run tests
        # Tests run WITHOUT a real database — your unit/integration tests
        # should mock the DB layer. If tests need a DB, add a postgres
        # service container here (ask me and I'll add it).
        run: mvn test

      # ── Step 4: Build JAR ──────────────────────────────────────────────────
      - name: Build JAR
        # -DskipTests = tests already ran in Step 3, no need to run twice.
        # package = compile + test-compile + jar. Output: target/*.jar
        run: mvn package -DskipTests

      # ── Step 5: Connect to AWS ─────────────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # These come from GitHub Secrets (Settings → Secrets → Actions).
          # Never hardcode AWS keys — they'd be public in your repo history forever.
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}   # e.g. us-east-1

      # ── Step 6: Log in to ECR ──────────────────────────────────────────────
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        # Runs: aws ecr get-login-password | docker login
        # The "id: login-ecr" lets us reference outputs.registry below.

      # ── Step 7: Build, tag, and push Docker image ──────────────────────────
      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          # Tag with the git commit SHA so every image is uniquely traceable.
          # e.g. 123456789.dkr.ecr.us-east-1.amazonaws.com/chikara-backend:a1b2c3d
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Build the image using the Dockerfile in repo root
          docker build -t $ECR_REGISTRY/${{ secrets.ECR_REPOSITORY }}:$IMAGE_TAG .

          # Push the commit-SHA tagged image (immutable, traceable)
          docker push $ECR_REGISTRY/${{ secrets.ECR_REPOSITORY }}:$IMAGE_TAG

          # Also tag as "latest" so ECS can always pull the most recent image
          docker tag $ECR_REGISTRY/${{ secrets.ECR_REPOSITORY }}:$IMAGE_TAG \
                     $ECR_REGISTRY/${{ secrets.ECR_REPOSITORY }}:latest

          docker push $ECR_REGISTRY/${{ secrets.ECR_REPOSITORY }}:latest

      # ── Step 8: Deploy to ECS ──────────────────────────────────────────────
      - name: Deploy to ECS
        run: |
          # Tell ECS to stop the current task and start a new one using the
          # latest image. ECS pulls :latest from ECR automatically.
          # --force-new-deployment = deploy even if the task definition hasn't changed
          aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --service ${{ secrets.ECS_SERVICE }} \
            --force-new-deployment \
            --region ${{ secrets.AWS_REGION }}

      # ── Step 9: Wait for deployment to stabilize ───────────────────────────
      - name: Wait for ECS deployment
        run: |
          # Block the pipeline until ECS confirms the new task is healthy.
          # If the new container crashes (e.g. bad DB creds), this step fails
          # and GitHub marks the deployment as failed — you get notified.
          # Timeout after 5 minutes (300s) if it never becomes stable.
          aws ecs wait services-stable \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --services ${{ secrets.ECS_SERVICE }} \
            --region ${{ secrets.AWS_REGION }}